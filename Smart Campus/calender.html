<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green & White Interactive Calendar</title>
  <style>
    :root {
      --primary-green: #1b7a43;
      --dark-green: #125830;
      --light-green: #e8f5ee;
      --accent-green: #2ecc71;
      --soft-border: #d4e6dc;
      --text-dark: #1e2d24;
      --text-muted: #6c8275;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f3f9f5;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calendar-container {
      background: var(--white);
      width: 100%;
      max-width: 850px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(27, 122, 67, 0.12);
      overflow: hidden;
      border: 1px solid var(--soft-border);
    }

    /* Header Section */
    .calendar-header {
      background: linear-gradient(135deg, var(--primary-green), var(--dark-green));
      color: var(--white);
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .month-year {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.15);
      color: var(--white);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--white);
      color: var(--primary-green);
    }

    .btn-today {
      background: var(--white);
      color: var(--primary-green);
    }

    .btn-today:hover {
      background: var(--light-green);
    }

    /* Days of Week Row */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: var(--light-green);
      border-bottom: 1px solid var(--soft-border);
    }

    .weekdays div {
      text-align: center;
      padding: 14px 0;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-green);
    }

    /* Calendar Grid */
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-cell {
      min-height: 100px;
      border-right: 1px solid var(--soft-border);
      border-bottom: 1px solid var(--soft-border);
      padding: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--white);
    }

    .day-cell:nth-child(7n) {
      border-right: none;
    }

    .day-cell:hover:not(.other-month) {
      background-color: #f6fbf8;
    }

    .day-number {
      font-size: 0.95rem;
      font-weight: 600;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .other-month {
      background-color: #fafcfb;
      color: #b0c2b7;
      cursor: default;
    }

    /* Today Highlight */
    .today .day-number {
      background-color: var(--primary-green);
      color: var(--white);
      box-shadow: 0 3px 8px rgba(27, 122, 67, 0.35);
    }

    .today {
      background-color: #f1faf4;
    }

    /* Event Badge */
    .event-badge {
      background-color: var(--light-green);
      color: var(--dark-green);
      border-left: 3px solid var(--primary-green);
      font-size: 0.78rem;
      padding: 4px 6px;
      border-radius: 4px;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    /* Modal for Adding Notes */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 88, 48, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--white);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      border-top: 5px solid var(--primary-green);
    }

    .modal h3 {
      color: var(--primary-green);
      margin-bottom: 12px;
    }

    .modal input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--soft-border);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }

    .modal input:focus {
      border-color: var(--primary-green);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-save {
      background: var(--primary-green);
      color: var(--white);
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-save:hover {
      background: var(--dark-green);
    }

    .btn-cancel {
      background: #eef3f0;
      color: var(--text-dark);
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .day-cell {
        min-height: 70px;
        padding: 6px;
      }
      .month-year {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-header">
      <div class="month-year" id="monthYearDisplay">Month Year</div>
      <div class="header-controls">
        <button class="btn" id="prevMonthBtn">&larr; Prev</button>
        <button class="btn btn-today" id="todayBtn">Today</button>
        <button class="btn" id="nextMonthBtn">Next &rarr;</button>
      </div>
    </div>

    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>

    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- Event Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal">
      <h3 id="modalDateTitle">Add Note</h3>
      <input type="text" id="eventInput" placeholder="Enter event or reminder..." />
      <div class="modal-actions">
        <button class="btn-cancel" id="deleteEventBtn" style="margin-right:auto; color:#c0392b;">Clear</button>
        <button class="btn-cancel" id="closeModalBtn">Cancel</button>
        <button class="btn-save" id="saveEventBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const monthYearDisplay = document.getElementById("monthYearDisplay");
    const daysGrid = document.getElementById("daysGrid");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");
    const todayBtn = document.getElementById("todayBtn");

    const eventModal = document.getElementById("eventModal");
    const modalDateTitle = document.getElementById("modalDateTitle");
    const eventInput = document.getElementById("eventInput");
    const saveEventBtn = document.getElementById("saveEventBtn");
    const deleteEventBtn = document.getElementById("deleteEventBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");

    let currentDate = new Date();
    let selectedDateKey = null;

    // Load saved events from localStorage
    let events = JSON.parse(localStorage.getItem("greenCalendarEvents")) || {};

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearDisplay.textContent = `${monthNames[month]} ${year}`;
      daysGrid.innerHTML = "";

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const prevLastDay = new Date(year, month, 0).getDate();

      const today = new Date();

      // Previous month's trailing days
      for (let x = firstDayIndex; x > 0; x--) {
        const cell = document.createElement("div");
        cell.classList.add("day-cell", "other-month");
        cell.innerHTML = `<span class="day-number">${prevLastDay - x + 1}</span>`;
        daysGrid.appendChild(cell);
      }

      // Current month's days
      for (let day = 1; day <= lastDay; day++) {
        const cell = document.createElement("div");
        cell.classList.add("day-cell");

        const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

        if (
          day === today.getDate() &&
          month === today.getMonth() &&
          year === today.getFullYear()
        ) {
          cell.classList.add("today");
        }

        let content = `<span class="day-number">${day}</span>`;
        if (events[dateKey]) {
          content += `<div class="event-badge">${events[dateKey]}</div>`;
        }

        cell.innerHTML = content;
        cell.addEventListener("click", () => openModal(dateKey, `${monthNames[month]} ${day}, ${year}`));
        daysGrid.appendChild(cell);
      }

      // Next month's leading days to fill out the grid cleanly
      const totalCells = firstDayIndex + lastDay;
      const nextDays = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let j = 1; j <= nextDays; j++) {
        const cell = document.createElement("div");
        cell.classList.add("day-cell", "other-month");
        cell.innerHTML = `<span class="day-number">${j}</span>`;
        daysGrid.appendChild(cell);
      }
    }

    function openModal(dateKey, readableDate) {
      selectedDateKey = dateKey;
      modalDateTitle.textContent = readableDate;
      eventInput.value = events[dateKey] || "";
      eventModal.classList.add("active");
      eventInput.focus();
    }

    function closeModal() {
      eventModal.classList.remove("active");
      selectedDateKey = null;
    }

    saveEventBtn.addEventListener("click", () => {
      if (!selectedDateKey) return;
      const val = eventInput.value.trim();
      if (val) {
        events[selectedDateKey] = val;
      } else {
        delete events[selectedDateKey];
      }
      localStorage.setItem("greenCalendarEvents", JSON.stringify(events));
      closeModal();
      renderCalendar();
    });

    deleteEventBtn.addEventListener("click", () => {
      if (!selectedDateKey) return;
      delete events[selectedDateKey];
      localStorage.setItem("greenCalendarEvents", JSON.stringify(events));
      closeModal();
      renderCalendar();
    });

    closeModalBtn.addEventListener("click", closeModal);
    eventModal.addEventListener("click", (e) => {
      if (e.target === eventModal) closeModal();
    });

    eventInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") saveEventBtn.click();
    });

    prevMonthBtn.addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    todayBtn.addEventListener("click", () => {
      currentDate = new Date();
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
